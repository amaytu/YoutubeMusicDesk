name: retag

# Uso único: aponta as tags das versões para os commits reescritos da main.
on:
  push:
    branches: [main]
    paths: [".github/workflows/retag.yml"]

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover tags
        run: |
          set -e
          while read tag sha; do
            [ -z "$tag" ] && continue
            git cat-file -e "$sha^{commit}"
            git tag -f "$tag" "$sha"
            git push -f origin "refs/tags/$tag"
          done <<'MAP'
          v0.3.0 b9c694e3ec5c6ae76e28c8f8b690d40179cd6189
          v0.3.1 96a25c604da4d8d52cdc32d55f9b7ec5176cf145
