name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend (deps + checagem de tipos)
        run: |
          npm ci
          npm run check

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Testes e lint
        working-directory: src-tauri
        run: |
          npm --prefix .. run build
          cargo clippy --release -- -D warnings
          cargo test --release

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build (NSIS + MSI)
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusicDesk-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YouTube Music Desk ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Download
            - **Instalador recomendado:** `YouTube.Music.Desk_*_x64-setup.exe` (instala só para o seu usuário, sem pedir administrador)
            - Alternativa: `*.msi`

            O instalador ainda não é assinado: na primeira execução o Windows SmartScreen pode avisar.
            Clique em **Mais informações → Executar assim mesmo**.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
