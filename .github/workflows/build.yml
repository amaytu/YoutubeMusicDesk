name: build

# Cada push na main compila e testa. Se a versão em src-tauri/tauri.conf.json
# ainda não tiver release (tag v<versão>), o próprio workflow publica o release
# com o instalador. Para lançar uma versão nova: suba a versão e faça push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa das tags para saber se a versão já foi lançada

      - name: Versão
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Versão $V"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend (deps + checagem de tipos)
        run: |
          npm ci
          npm run check

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Testes e lint
        working-directory: src-tauri
        run: |
          npm --prefix .. run build
          cargo clippy --release -- -D warnings
          cargo test --release

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build (NSIS + MSI)
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusicDesk-${{ steps.ver.outputs.version }}-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YouTube Music Desk v${{ steps.ver.outputs.version }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Download
            - **Instalador recomendado:** `YouTube.Music.Desk_${{ steps.ver.outputs.version }}_x64-setup.exe`
              (instala só para o seu usuário, sem pedir administrador)
            - Alternativa: `YouTube.Music.Desk_${{ steps.ver.outputs.version }}_x64_pt-BR.msi` / `_en-US.msi`

            O instalador ainda não é assinado: na primeira execução o Windows SmartScreen pode avisar.
            Clique em **Mais informações → Executar assim mesmo**.

            ## Novidades
            - Interface própria com design liquid glass e transições
            - Ilha dinâmica em segundo plano com letra sincronizada
            - Login com o Google em poucos cliques
            - Modo economia, bandeja, teclas de mídia, iniciar com o Windows
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
