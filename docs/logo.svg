<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="0.55" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#c4000b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5a0006" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- bloco quadrado com cantos arredondados -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>
  <g clip-path="url(#tile)" filter="url(#sh)">
    <!-- fios dos fones: saem das hastes, se unem e sobem -->
    <path d="M232 250 C232 190 262 168 280 140 M362 226 C362 178 300 168 280 140 C262 112 300 70 282 10"
          fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <!-- hastes das notas -->
    <path d="M232 372 V246 M362 348 V222" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
    <!-- cabeças das notas -->
    <ellipse cx="194" cy="378" rx="48" ry="37" transform="rotate(-22 194 378)" fill="#fff"/>
    <ellipse cx="324" cy="354" rx="48" ry="37" transform="rotate(-22 324 354)" fill="#fff"/>
  </g>
</svg>
