<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="0.55" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#c4000b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5a0006" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- botão arredondado -->
  <rect x="20" y="86" width="472" height="340" rx="104" fill="url(#bg)"/>
  <rect x="20" y="86" width="472" height="340" rx="104" fill="url(#gloss)"/>
  <!-- notas ligadas pela metade = fones de ouvido -->
  <g fill="#fff" stroke="#fff" filter="url(#sh)">
    <!-- barra + hastes num traço só (arco do fone) -->
    <path d="M190 304 V238 C190 148 322 148 322 238 V304" fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cabeças das notas (conchas) -->
    <ellipse cx="170" cy="314" rx="40" ry="29" transform="rotate(-24 170 314)" stroke="none"/>
    <ellipse cx="342" cy="314" rx="40" ry="29" transform="rotate(24 342 314)" stroke="none"/>
  </g>
</svg>
