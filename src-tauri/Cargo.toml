[package]
name = "youtube-music-desk"
version = "1.0.1"
description = "Cliente desktop leve para o YouTube Music (Tauri + WebView2)"
authors = ["amaytu"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "youtube-music-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
# Mesmas versões usadas internamente pelo tauri/wry (evita duplicar crates).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# Binário pequeno e rápido: o host Rust fica em poucos MB de RAM.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
